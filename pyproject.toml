[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finrag"
version = "1.0.0"
description = "金融知识库 RAG 检索层与评测"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
model = ["sentence-transformers>=3.0", "numpy>=1.26"]
serve = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
bench = ["pymupdf>=1.24"]

[tool.setuptools.package-data]
finrag = ["web/*.html"]

[project.scripts]
finrag = "finrag.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
